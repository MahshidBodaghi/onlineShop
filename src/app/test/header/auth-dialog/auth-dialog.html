<div class="auth-dialog">
  <div class="auth-dialog__header">
    <h2 class="auth-dialog__title">Account</h2>

    <button
      mat-icon-button
      type="button"
      aria-label="Close dialog"
      mat-dialog-close
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="auth-dialog__content">
    <p class="auth-dialog__text">
      Sign in to your account or create a new one.
    </p>
  </div>

  <div class="auth-dialog__actions">
    <button mat-stroked-button type="button" (click)="openSignIn()">
      <mat-icon>login</mat-icon>
      Sign In
    </button>

    <button mat-flat-button color="primary" type="button" (click)="openSignUp()">
      <mat-icon>person_add</mat-icon>
      Sign Up
    </button>
  </div>
</div>
