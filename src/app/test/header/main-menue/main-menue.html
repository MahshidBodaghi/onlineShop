<div class="ocart--menu">
  <a mat-button href="#">
    <mat-icon>home</mat-icon>
    <span>Home</span>
  </a>

  <button
    mat-button
    [matMenuTriggerFor]="productsMenu"
  >
    <mat-icon>directions_run</mat-icon>
    <span>Shoes</span>
    <mat-icon>expand_more</mat-icon>
  </button>

  <button
    mat-button
    [matMenuTriggerFor]="brandsMenu"
  >
    <mat-icon>verified</mat-icon>
    <span>Brands</span>
    <mat-icon>expand_more</mat-icon>
  </button>

  <button
    mat-button
    [matMenuTriggerFor]="servicesMenu"
  >
    <mat-icon>support_agent</mat-icon>
    <span>Services</span>
    <mat-icon>expand_more</mat-icon>
  </button>
</div>

<!-- Shoes menu -->
<mat-menu #productsMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>directions_run</mat-icon>
    <span>Running Shoes</span>
  </button>

  <button mat-menu-item>
    <mat-icon>sports_basketball</mat-icon>
    <span>Basketball Shoes</span>
  </button>

  <button mat-menu-item>
    <mat-icon>hiking</mat-icon>
    <span>Hiking Shoes</span>
  </button>

  <button mat-menu-item>
    <mat-icon>checkroom</mat-icon>
    <span>Casual Sneakers</span>
  </button>
</mat-menu>

<!-- Brands menu -->
<mat-menu #brandsMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>workspace_premium</mat-icon>
    <span>Nike</span>
  </button>

  <button mat-menu-item>
    <mat-icon>workspace_premium</mat-icon>
    <span>Adidas</span>
  </button>

  <button mat-menu-item>
    <mat-icon>workspace_premium</mat-icon>
    <span>Puma</span>
  </button>

  <button mat-menu-item>
    <mat-icon>workspace_premium</mat-icon>
    <span>New Balance</span>
  </button>
</mat-menu>

<!-- Services menu -->
<mat-menu #servicesMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>straighten</mat-icon>
    <span>Size Guide</span>
  </button>

  <button mat-menu-item>
    <mat-icon>local_shipping</mat-icon>
    <span>Shipping Information</span>
  </button>

  <button mat-menu-item>
    <mat-icon>published_with_changes</mat-icon>
    <span>Returns & Exchanges</span>
  </button>

  <button mat-menu-item>
    <mat-icon>chat</mat-icon>
    <span>Contact Support</span>
  </button>
</mat-menu>
