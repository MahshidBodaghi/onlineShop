<div class="product-detail-overlay" *ngIf="product" (click)="closeProductDetail()"></div>

<div class="product-detail-panel" *ngIf="product as p">
  <div class="product-detail-close">
    <button class="product-detail-close-btn" (click)="closeProductDetail()">×</button>
  </div>

  <div class="product-detail-image-box">
    <img class="product-detail-image" [src]="p.imageURL" [alt]="p.name" />
  </div>

  <div class="product-detail-content">
    <div class="product-detail-name">
      <h2>{{ p.name }}</h2>
    </div>

    <div class="product-detail-categories">
      <span>{{ p.brand }}</span>
      <span>{{ p.category }}</span>
      <span>{{ p.gender }}</span>
    </div>

    <div class="product-detail-price">
      <p>
        <span class="product-old-price" *ngIf="p.discountPrice">{{ p.price | currency }}</span>
        <span class="product-new-price">{{ (p.discountPrice || p.price) | currency }}</span>
      </p>
    </div>

    <div class="product-detail-section">
      <div class="product-detail-section-title">
        <h4>Size</h4>
      </div>
      <div class="product-detail-sizes">
        <button class="product-size" *ngFor="let s of p.size">{{ s }}</button>
      </div>
    </div>

    <div class="product-detail-section">
      <div class="product-detail-section-title">
        <h4>Color</h4>
      </div>
      <div class="product-detail-colors">
        <button class="product-color" *ngFor="let c of p.color" [style.backgroundColor]="c"></button>
      </div>
    </div>

    <div class="product-detail-description">
      <div class="product-detail-section-title">
        <h4>Description</h4>
      </div>
      <div class="product-description-text">
        <p>{{ p.description }}</p>
      </div>
    </div>

    <div class="product-detail-cart">
      <button class="product-add-cart-btn" *ngIf="p.is_in_inventory; else notifyme">ADD TO CART</button>
      <ng-template #notifyme>
        <button class="product-notify-btn">NOTIFY ME</button>
      </ng-template>
    </div>
  </div>
</div>
